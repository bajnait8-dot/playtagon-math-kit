<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice — Replay Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #1a1a2e; color: #e0e0e0; padding: 20px;
    }
    h1 { font-size: 16px; color: #e94560; margin-bottom: 16px; }
    .info { font-size: 13px; color: #888; margin-bottom: 12px; }
    .info strong { color: #e0e0e0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: #888; padding: 6px 10px; border-bottom: 1px solid #0f3460; }
    td { padding: 6px 10px; border-bottom: 1px solid #16213e; }
    .win { color: #4caf50; }
    .lose { color: #e94560; }
    .error { color: #e94560; font-size: 14px; padding: 40px; text-align: center; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script type="module" src="./replay.ts"></script>
</body>
</html>
